[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tealtiger-mcp"
version = "1.0.0"
description = "MCP server exposing TealTiger guardrails, cost tracking, and budget enforcement as tools for Claude and other MCP clients."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "TealTiger", email = "reachout@tealtiger.ai" },
]
keywords = ["mcp", "tealtiger", "guardrails", "ai-security", "cost-tracking", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "tealtiger>=1.4.0",
    # Streamable HTTP first shipped in mcp 1.8.0. mcp 2.x renamed
    # FastMCP -> MCPServer and dropped mcp.server.fastmcp.
    "mcp>=1.8.0,<2",
]

[project.urls]
Homepage = "https://tealtiger.ai"
Documentation = "https://docs.tealtiger.ai"
Repository = "https://github.com/agentguard-ai/tealtiger"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
tealtiger-mcp = "tealtiger_mcp.server:main"

[tool.hatch.build]
# The monorepo .gitignore has a broad `src/` rule (with per-package `!`
# un-ignores). Hatchling's default file selection defers to VCS ignore and
# does not honour the negation, producing an empty wheel. Disable VCS-based
# selection so the package sources are always included.
ignore-vcs = true

[tool.hatch.build.targets.wheel]
only-include = ["src/tealtiger_mcp"]
sources = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
