name: Package Docs Drift

# Fail a PR when a package's src/ changes but its README.md does not, so
# source and docs cannot drift apart. Complements the Kiro `package-docs-sync`
# hook (which assists live in an editing session); this is the enforcement gate.
#
# Note: docs.tealtiger.ai lives in a separate repo (agentguard-ai/TealTiger-Docs),
# so this workflow enforces the same-repo README and only *reminds* about the
# matching integration page.

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/**'

permissions:
  contents: read

jobs:
  docs-drift:
    name: README kept in sync with package src
    runs-on: ubuntu-latest
    # Escape hatch: label the PR `docs-not-needed` to bypass for changes that
    # genuinely do not affect documented behavior.
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'docs-not-needed') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Compute changed files
        run: |
          base="origin/${{ github.event.pull_request.base.ref }}"
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.ref }}"
          git diff --name-only "$base"...HEAD > changed_files.txt
          echo "Changed files:"
          cat changed_files.txt

      - name: Check package/README drift
        run: python .github/scripts/check_package_docs_drift.py changed_files.txt
