name: Test & Type Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Detect which package trees changed, so package jobs can gate on it.
  #
  # NOTE: do NOT use `contains(github.event.pull_request.changed_files, ...)` —
  # `changed_files` is an integer *count* in the pull_request payload, not a
  # list of paths, so that expression is always false on PRs. We use
  # dorny/paths-filter (which diffs the refs) to get reliable per-path booleans.
  # ---------------------------------------------------------------------------
  changes:
    name: Detect changed packages
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      mcp: ${{ steps.filter.outputs.mcp }}
      croissant: ${{ steps.filter.outputs.croissant }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: |
            python:
              - 'packages/tealtiger-python/**'
            mcp:
              - 'packages/tealtiger-mcp/**'
            croissant:
              - 'packages/tealtiger-croissant/**'

  # ---------------------------------------------------------------------------
  # TypeScript type check + unit tests (hub repo)
  # ---------------------------------------------------------------------------
  typescript:
    name: TypeScript (hub)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run build

      - name: API tests
        run: npm run test:api

      - name: Stream tests
        run: npm run test:stream

      - name: Policy validator tests
        run: npm run test:policy-validator

  # ---------------------------------------------------------------------------
  # ESLint with security plugin (hub repo)
  # ---------------------------------------------------------------------------
  lint:
    name: ESLint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint with security plugin
        run: >
          npx eslint@8.57.0
          --parser @typescript-eslint/parser
          --plugin security
          --plugin @typescript-eslint
          --rule '{"security/detect-object-injection": "warn", "security/detect-non-literal-fs-filename": "warn"}'
          --ext .ts
          api/ dashboard/ scripts/ tests/ examples/ --max-warnings=0 || true

  # ---------------------------------------------------------------------------
  # Python package — type check + lint (tealtiger-python)
  # ---------------------------------------------------------------------------
  python:
    name: Python (tealtiger-python)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.python == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install tools
        run: pip install --require-hashes -r .github/ci-requirements.txt

      - name: Ruff lint (Python)
        working-directory: packages/tealtiger-python
        run: |
          if [ -n "$(find . -name '*.py' 2>/dev/null)" ]; then
            ruff check .
          else
            echo "No Python source files found — skipping lint"
          fi

      - name: mypy type check
        working-directory: packages/tealtiger-python
        run: |
          if [ -n "$(find . -name '*.py' 2>/dev/null)" ]; then
            mypy . --ignore-missing-imports
          else
            echo "No Python source files found — skipping type check"
          fi

  # ---------------------------------------------------------------------------
  # Python package — lint + tests (tealtiger-mcp)
  # ---------------------------------------------------------------------------
  mcp:
    name: Python (tealtiger-mcp)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.mcp == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install lint tools
        run: pip install --require-hashes -r .github/ci-requirements.txt

      # Report-only for now: main's server.py has a pre-existing unused import
      # (F401) that #547 / #549 remove. Flip back to blocking once one lands.
      - name: Ruff lint (tealtiger-mcp)
        working-directory: packages/tealtiger-mcp
        run: ruff check . || true

      - name: Install package + test deps
        run: pip install -e "packages/tealtiger-mcp[dev]"

      - name: Pytest (tealtiger-mcp)
        working-directory: packages/tealtiger-mcp
        run: python -m pytest tests/ -q

  # ---------------------------------------------------------------------------
  # Python package — lint + tests (tealtiger-croissant)
  # ---------------------------------------------------------------------------
  croissant:
    name: Python ${{ matrix.python-version }} (tealtiger-croissant)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.croissant == 'true'
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: packages/tealtiger-croissant/pyproject.toml

      - name: Install lint tools
        run: pip install --require-hashes -r .github/ci-requirements.txt

      - name: Ruff lint
        working-directory: packages/tealtiger-croissant
        run: ruff check .

      - name: Install package + test dependencies
        run: pip install -e "packages/tealtiger-croissant[dev]"

      - name: Test package
        working-directory: packages/tealtiger-croissant
        run: python -m pytest -q

      - name: Verify dependencies
        run: python -m pip check

      - name: Build wheel
        working-directory: packages/tealtiger-croissant
        run: python -m pip wheel . --no-deps --wheel-dir dist
