name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  # ---------------------------------------------------------------------------
  # GitHub's dependency-review-action compares the dependency graph before and
  # after the PR and blocks merge when it finds newly introduced packages with
  # known high/critical CVEs or licenses incompatible with this project.
  # ---------------------------------------------------------------------------
  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # Block GPL / AGPL / LGPL — incompatible with Apache 2.0
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-2.0, LGPL-2.1, LGPL-3.0
          # trufflehog is AGPL-3.0, but it is invoked as a CI *action* (our secret
          # scanner), not linked into the Apache-2.0 product — AGPL copyleft does
          # not attach to running a tool in CI. Without this exemption the license
          # gate blocks every trufflehog action bump (e.g. #543) forever. Exempt
          # only this action from the LICENSE check; vulnerability checks and all
          # other dependencies' license checks are unaffected.
          allow-dependencies-licenses: "pkg:githubactions/trufflesecurity/trufflehog"
          comment-summary-in-pr: always
